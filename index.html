function loadViaJSONP(url) {
  return new Promise((resolve, reject) => {
    const callbackName = 'cb_' + Math.random().toString(36).slice(2);
    const fullUrl = url + '?callback=' + callbackName;
    const script = document.createElement('script');

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('JSONP timeout'));
    }, 10000);

    window[callbackName] = function(data) {
      cleanup();
      try {
        processData(data);
        resolve();
      } catch(e) { reject(e); }
    };

    function cleanup() {
      clearTimeout(timer);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    script.onerror = () => { cleanup(); reject(new Error('JSONP script load failed')); };
    script.src = fullUrl;
    document.head.appendChild(script);
  });
}

function processData(data) {
  const status = document.getElementById('data-status');
  const refreshBtn = document.getElementById('refresh-btn');

  const [charHeader, ...charData_rows] = data.chars;
  const ci = charHeader.map(h => String(h).toLowerCase().trim());
  allCharData = charData_rows.map(r => ({
    character: String(r[ci.indexOf('character')] || '').trim(),
    pinyin:    String(r[ci.indexOf('pinyin')]    || '').trim(),
    serialNo:  parseInt(r[ci.indexOf('no')]      || r[2] || 9999),
    words:     String(r[ci.indexOf('words')]     || r[3] || '').split(/[,，]/).map(w => w.trim()).filter(Boolean),
    skip:      String(r[ci.indexOf('skip')]      || '').trim().toLowerCase() === 'y',
  })).filter(r => r.character && r.pinyin);

  const [wordHeader, ...wordData_rows] = data.words;
  const wi = wordHeader.map(h => String(h).toLowerCase().trim());
  const wordCol    = wi.indexOf('word') !== -1 ? wi.indexOf('word') : wi.indexOf('words');
  const meaningCol = wi.indexOf('meaning');
  const pinyinCol  = wi.indexOf('pinyin');
  allWordData = wordData_rows.map(r => ({
    word:    String(r[wordCol]    || '').trim(),
    meaning: String(r[meaningCol] || '').trim(),
    pinyin:  String(r[pinyinCol]  !== undefined ? r[pinyinCol] : (r[2] || '')).trim(),
  })).filter(r => r.word && r.meaning);

  try { localStorage.setItem('chineseAppData', JSON.stringify({ allCharData, allWordData, savedAt: Date.now() })); } catch(e) {}
  if (refreshBtn) { refreshBtn.disabled = false; refreshBtn.textContent = '🔄 重新加载'; }
  updateHomeButtons();
}

    document.getElementById('threshold-status').style.color = '#FF4E4E';

function applyThreshold() {
  charData = allCharData.filter(d => d.serialNo <= threshold && !d.skip);
  const knownChars = new Set(charData.map(d => d.character));
  wordData = allWordData.filter(d => [...d.word].every(c => knownChars.has(c)));
  updateHomeButtons();

      ind.style.color = '#aaa';
    }
  }
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function pinyinBase(p) { return p.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\d/g,'').toLowerCase(); }

// ── FRESHNESS QUEUE（跨 session 持久化，localStorage LRU）───────────────────
// 记录每个 quiz 类型最近出过的题目 id（char-pinyin-mix/listen-word 用 character，
// meaning-match/fill-blank 用 word），选题时优先避开，避免连续几轮重复出同一批。
const FRESHNESS_KEY = 'chineseAppFreshness';
const FRESHNESS_MAX = 30; // 每个 quiz 类型最多记住最近 30 个 id

function loadFreshness() {
  try { return JSON.parse(localStorage.getItem(FRESHNESS_KEY) || '{}'); } catch(e) { return {}; }
}
function getRecentlyUsedIds(quizType) {
  const data = loadFreshness();
  return new Set(data[quizType] || []);
}
function markUsedIds(quizType, ids) {
  if (!ids.length) return;
  const data = loadFreshness();
  let queue = data[quizType] || [];
  queue = queue.concat(ids);
  if (queue.length > FRESHNESS_MAX) queue = queue.slice(queue.length - FRESHNESS_MAX);
  data[quizType] = queue;
  try { localStorage.setItem(FRESHNESS_KEY, JSON.stringify(data)); } catch(e) {}
}

// ── "最近学习"池：当前 threshold 内，按 serialNo 取最高的 20% ──────────────
function getRecentChars() {
  if (charData.length === 0) return [];
  const n = Math.max(1, Math.ceil(charData.length * 0.2));
  return [...charData].sort((a, b) => b.serialNo - a.serialNo).slice(0, n);
}
function getRecentWords(pool = wordData) {
  if (pool.length === 0) return [];
  const serialMap = new Map(charData.map(d => [d.character, d.serialNo]));
  const withMax = pool.map(d => ({
    ...d,
    maxSerial: Math.max(...[...d.word].map(c => serialMap.has(c) ? serialMap.get(c) : 0))
  }));
  const n = Math.max(1, Math.ceil(withMax.length * 0.2));
  return withMax.sort((a, b) => b.maxSerial - a.maxSerial).slice(0, n);
}

}

// 从"最近学习"池取 recentCount 题、从完整池取剩余题，两边都优先避开
// freshness 队列里的 id；不够时才回退到允许重复。选完后立即写回 freshness 队列。
// 只适用于"选中即可用"的场景（char-pinyin-mix / listen-word / meaning-match / fill-blank）。
function pickHalfRecentPool(fullPool, recentPool, idField, recentCount, totalCount, quizType) {
  const order  = buildHalfRecentOrder(fullPool, recentPool, idField, recentCount, totalCount, quizType);
  const picked = order.slice(0, Math.min(totalCount, order.length));
  markUsedIds(quizType, picked.map(d => d[idField]));
  return picked;
}

function startGame(type) {
  if (type === 'word-link') { startWordLink(); return; }
  if (type === 'odd-one-out') { startOddOneOut(); return; }
  if (type === 'word-chain') { startWordChain(); return; }
  if ((type==='meaning-match'||type==='fill-blank') && wordData.length<4) { alert('Need at least 4 words!'); return; }
  if (type==='char-pinyin-mix' && charData.length<5) { alert('Need at least 5 characters!'); return; }

  currentGame = type; currentQ = 0; gameCorrect = 0; answered = false;
  questions = generateQuestions(type);
}

// Distractors for word-level options: prefer same character-length as the
// correct word (so options can't be eliminated just by glancing at length).
// Falls back to closest-length words if not enough same-length candidates exist.
function pickSameLengthWordDistractors(pool, item, count) {
  const targetLen = [...item.word].length;
  const candidates = pool.filter(d => d.word !== item.word);
  const sameLen = shuffle(candidates.filter(d => [...d.word].length === targetLen));
  let picked = sameLen.slice(0, count);
  if (picked.length < count) {
    const pickedWords = new Set(picked.map(d => d.word));
    const remaining = shuffle(candidates.filter(d => !pickedWords.has(d.word)))
      .sort((a, b) => Math.abs([...a.word].length - targetLen) - Math.abs([...b.word].length - targetLen));
    picked = picked.concat(remaining.slice(0, count - picked.length));
  }
  return picked.map(d => d.word);
}

function generateQuestions(type) {
  if (type === 'char-pinyin-mix') {
    const half  = Math.floor(QUESTIONS_PER_GAME / 2);      // 7
    const extra = QUESTIONS_PER_GAME - half;                // 8
    const dirs  = Math.random() > 0.5
      ? [...Array(extra).fill('char-to-pinyin'), ...Array(half).fill('pinyin-to-char')]
      : [...Array(half).fill('char-to-pinyin'), ...Array(extra).fill('pinyin-to-char')];
    const shuffledDirs = shuffle(dirs);
    const pool = pickHalfRecentPool(charData, getRecentChars(), 'character', 8, QUESTIONS_PER_GAME, 'char-pinyin-mix');
    return pool.map((item, i) => {
      const dir = shuffledDirs[i];
      if (dir === 'char-to-pinyin') {
        const wrong = shuffle(charData.filter(d=>d.character!==item.character)).slice(0,3).map(d=>d.pinyin);
        return { item, type, dir, answer: item.pinyin, options: shuffle([item.pinyin,...wrong]) };
      } else {
        const base  = pinyinBase(item.pinyin);
        const wrong = shuffle(charData.filter(d=>d.character!==item.character&&pinyinBase(d.pinyin)!==base)).slice(0,3).map(d=>d.character);
        return { item, type, dir, answer: item.character, options: shuffle([item.character,...wrong]) };
    return pool.map(item => {
      const chars = [...item.word];
      const blankIdx = Math.floor(Math.random()*chars.length);
      const answer = chars[blankIdx];
      const wrong = shuffle(charData.filter(d=>d.character!==answer)).slice(0,3).map(d=>d.character);
      return { item, type, chars, blankIdx, answer, options: shuffle([answer,...wrong]) };
    });
  }
}

  else if (score >= 70) { emoji='🎉'; stars='⭐⭐'; title='Great job!'; msg='So close — keep going!'; }
  else { emoji='💪'; stars='⭐'; title='Keep going!'; msg='Practice the chains!'; }

  document.getElementById('result-emoji').textContent    = emoji;
  document.getElementById('result-stars').textContent    = stars;
  document.getElementById('result-title').textContent    = title;
  document.getElementById('result-msg').textContent      = msg;
  document.getElementById('result-attempts').textContent = '';
  document.getElementById('play-again-btn').style.display = 'block';
}



</script>
</body>
</html>
